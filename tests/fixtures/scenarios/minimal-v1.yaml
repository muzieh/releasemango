schemaVersion: 1
metadata:
  id: tutorial-minimal
  title: Minimal release exercise
  description: Practice selecting different acceptance and production releases.
seed: 42
workspace:
  initialMain: commit-a
ticketStatuses:
  - id: ready
    name: Ready
  - id: done
    name: Done
tickets:
  - id: TEA-101
    title: First ticket
    status: done
  - id: TEA-102
    title: Second ticket
    status: ready
commits:
  - id: commit-b
    ticket: TEA-102
    message: Prepare second ticket
    dependsOn: [commit-a]
  - id: commit-a
    ticket: TEA-101
    message: Complete first ticket
    dependsOn: []
releases:
  acceptance:
    baseline: commit-a
    tickets: [TEA-101]
    requiredChecks: [tests, typecheck]
    forbiddenChecks: [no-debug-log]
  production:
    baseline: commit-b
    tickets: [TEA-101, TEA-102]
    requiredChecks: [typecheck]
    forbiddenChecks: []
checks:
  required:
    - id: typecheck
      command: pnpm
      args: [typecheck]
    - id: tests
      command: pnpm
      args: [test]
  forbidden:
    - id: no-debug-log
      command: rg
      args: [console.log, src]
hints:
  - tier: 1
    text: Inspect the ticket dependencies.
  - tier: 2
    text: Compare the release scopes.
scoring:
  weights:
    required: 40
    forbidden: 20
    repository: 20
    infrastructure: 20
  mandatoryChecks: [tests, repository.clean]
