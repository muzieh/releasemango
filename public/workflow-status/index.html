<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Mango Workflow</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">Release Mango</p>
          <h1>Workflow pulse</h1>
        </div>
        <div id="connection" class="connection">Connecting</div>
      </header>
      <section id="workflow" class="workflow panel"></section>
      <section class="metrics" aria-label="Agent summary">
        <article><span id="running">0</span><small>Running</small></article>
        <article><span id="blocked">0</span><small>Blocked</small></article>
        <article><span id="completed">0</span><small>Completed</small></article>
        <article><span id="total">0</span><small>Total</small></article>
      </section>
      <section>
        <div class="section-title">
          <h2>Agents</h2>
          <span id="updated"></span>
        </div>
        <div id="agents" class="agents"></div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
