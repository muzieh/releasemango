name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Confirm toolchain versions
        shell: bash
        run: |
          node --version
          pnpm --version
          git --version
          minimum=2.39.0
          actual="$(git version | awk '{print $3}')"
          first="$(printf '%s\n%s\n' "$minimum" "$actual" | sort -V | head -n1)"
          test "$first" = "$minimum"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gates
        run: pnpm verify
